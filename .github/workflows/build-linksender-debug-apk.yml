name: Build Link Sender debug APK

# Manual only: no automatic builds on commit or push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7 for AGP 8.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Run synthetic Java checks
        run: |
          bash core-tests/run.sh
          python3 core-tests/check_source_safety.py
          python3 core-tests/run_mock_ui_probe.py
          python3 core-tests/test_stale_link_guard.py
          python3 core-tests/test_green_ui_contract.py
          python3 core-tests/test_wqa387_focus_integration.py
      - name: Build APK with the genuine Android SDK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Show APK SHA256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload built APK for owner review
        uses: actions/upload-artifact@v4
        with:
          name: LinkSender-v0.1.4.2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
